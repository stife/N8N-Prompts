# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# For more information: https://github.com/Azure/actions-workflow-samples

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies securely and reliably
      # Use 'npm ci' for deterministic builds based on package-lock.json
      run: npm ci

    - name: Run security audit
      # NEW: Check for vulnerabilities in dependencies. Fails if high-severity issues are found.
      run: npm audit --audit-level=high

    - name: Build and test application
      # Combined build and test steps. Assumes you have 'lint', 'build', and 'test' scripts in your package.json
      run: |
        npm run build --if-present
        npm run test --if-present

    - name: Prune development dependencies
      # NEW: Remove packages listed in 'devDependencies' to reduce package size
      run: npm prune --production

    - name: Upload artifact for deployment job
      # IMPROVED: Only upload the files needed for production, not the whole repository
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: |
          .
          !node_modules/.cache
          !src/
          !tests/

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
